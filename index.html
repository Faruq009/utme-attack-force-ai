<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <title>UTME Attack Force AI Tutor</title>
</head>

<body>

  <header>
    <h1>UTME Attack Force AI Tutor</h1>
    <p>Learn. Practice. Attack UTME.</p>
  </header>

  <main>

    <section>
      <h2>Choose a Subject</h2>

      <button onclick="chooseSubject('Use of English')">Use of English</button>
<button onclick="chooseSubject('Physics')">Physics</button>
<button onclick="chooseSubject('Chemistry')">Chemistry</button>
<button onclick="chooseSubject('Mathematics')">Mathematics</button>
<button onclick="chooseSubject('Biology')">Biology</button>
    
    </section>

    <section>
      <h2>What do you want to do?</h2>

      <button>📚 Lessons</button>
      <button>📝 Practice</button>
      <button>🎯 UTME Mock</button>
      <button>📊 My Progress</button>
      <button>🔥 Daily Attack</button>
    </section>

    <section>
      <h2>🤖 AI Tutor</h2>

      <p>Ask me a question by typing, speaking, or sending a photo.</p>

      <input
        type="text"
        placeholder="Ask your AI Tutor..."
      >

      <button>🎤 Voice</button>
      <button>📷 Photo</button>
      <button>Send</button>
    </section>

  </main>
<script src="script.js"></script>
</body>
</html>
