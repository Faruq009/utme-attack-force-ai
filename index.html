<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <title>UTME Attack Force AI Tutor</title>
</head>

<body>

  <header>
    <h1>UTME Attack Force AI Tutor</h1>
    <p>Learn. Practice. Attack UTME.</p>
  </header>

  <main>

    <section>
      <h2>Choose Your Subject</h2>

      <button onclick="chooseSubject('Use of English')">
        📖 Use of English
      </button>

      <button onclick="chooseSubject('Physics')">
        ⚡ Physics
      </button>

      <button onclick="chooseSubject('Chemistry')">
        🧪 Chemistry
      </button>

      <button onclick="chooseSubject('Mathematics')">
        📐 Mathematics
      </button>

      <button onclick="chooseSubject('Biology')">
        🧬 Biology
      </button>
    </section>

    <section>
      <h2>Learning</h2>

      <button onclick="showMessage('Lessons')">
        📚 Lessons
      </button>

      <button onclick="showMessage('Practice')">
        📝 Practice
      </button>

      <button onclick="showMessage('UTME Mock')">
        🎯 UTME Mock
      </button>

      <button onclick="showMessage('My Progress')">
        📊 My Progress
      </button>

      <button onclick="showMessage('Daily Attack')">
        🔥 Daily Attack
      </button>
    </section>

    <section>
      <h2>🤖 AI Tutor</h2>

      <p id="selectedSubject">
        Select a subject to begin.
      </p>

      <input
        id="questionInput"
        type="text"
        placeholder="Ask your AI Tutor..."
      >

      <button onclick="sendQuestion()">
        Send Question
      </button>

      <button onclick="startVoice()">
        🎤 Voice Input
      </button>

      <button onclick="document.getElementById('photoInput').click()">
        📷 Send Photo
      </button>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        style="display: none;"
        onchange="photoSelected()"
      >

      <div id="response">
        Your AI Tutor's answer will appear here.
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
